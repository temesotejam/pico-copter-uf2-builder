name: Migrate firmware into portable folder

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-firmware-layout.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Move firmware without changing program files
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum --check --strict SOURCE_SHA256SUMS.txt

          PROGRAM_FILES=(
            pico_copter.cpp
            pico_copter.hpp
            control.cpp
            control.hpp
            ekf.cpp
            ekf.hpp
            sensor.cpp
            sensor.hpp
            pwm.cpp
            pwm.hpp
            radio.cpp
            radio.hpp
            lsm9ds1_reg.c
            lsm9ds1_reg.h
          )

          mkdir -p firmware/pico_copter
          for FILE in "${PROGRAM_FILES[@]}"; do
            mv "source/${FILE}" "firmware/pico_copter/${FILE}"
          done

          cat > firmware/pico_copter/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.13)

          if(NOT DEFINED PICO_SDK_PATH)
              if(DEFINED ENV{PICO_SDK_PATH})
                  set(PICO_SDK_PATH "$ENV{PICO_SDK_PATH}")
              else()
                  message(FATAL_ERROR "PICO_SDK_PATH is required")
              endif()
          endif()

          include("${PICO_SDK_PATH}/external/pico_sdk_import.cmake")

          project(pico_copter C CXX ASM)

          set(CMAKE_C_STANDARD 11)
          set(CMAKE_C_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          pico_sdk_init()

          set(EIGEN3_INCLUDE_DIR "" CACHE PATH "Directory containing Eigen/Dense")

          if(NOT EIGEN3_INCLUDE_DIR)
              include(FetchContent)
              FetchContent_Declare(
                  eigen
                  GIT_REPOSITORY https://gitlab.com/libeigen/eigen.git
                  GIT_TAG 3147391d946bb4b6c68edd901f2add6ac1f31f8c
              )
              FetchContent_GetProperties(eigen)
              if(NOT eigen_POPULATED)
                  FetchContent_Populate(eigen)
              endif()
              set(EIGEN3_INCLUDE_DIR "${eigen_SOURCE_DIR}")
          endif()

          if(NOT EXISTS "${EIGEN3_INCLUDE_DIR}/Eigen/Dense")
              message(FATAL_ERROR "Eigen/Dense was not found at ${EIGEN3_INCLUDE_DIR}")
          endif()

          add_executable(pico_copter
              pico_copter.cpp
              sensor.cpp
              ekf.cpp
              lsm9ds1_reg.c
              pwm.cpp
              radio.cpp
              control.cpp
          )

          target_include_directories(pico_copter PRIVATE
              "${CMAKE_CURRENT_SOURCE_DIR}"
              "${EIGEN3_INCLUDE_DIR}"
          )

          target_link_libraries(pico_copter PRIVATE
              hardware_spi
              hardware_pwm
              hardware_uart
              pico_stdlib
              pico_multicore
          )

          pico_enable_stdio_usb(pico_copter 1)
          pico_enable_stdio_uart(pico_copter 0)
          pico_add_extra_outputs(pico_copter)
          CMAKE

          cat > firmware/pico_copter/README.md <<'README'
          # Pico Copter firmware

          このフォルダが、Raspberry Pi Picoへ書き込むファームウェアの独立したプロジェクトです。共有するときは`firmware/pico_copter`フォルダをそのまま取り出せます。

          `.cpp`、`.hpp`、`.c`、`.h`は、提供された元プログラムの内容を変更していません。`SOURCE_SHA256SUMS.txt`で確認できます。

          ## 必要なもの

          - Raspberry Pi Pico SDK 2.3.0
          - ARM GCC
          - CMake 3.13以上
          - Eigen 3.4.0

          Eigenの場所を指定しない場合、CMakeが公式Eigenの固定コミットを自動取得します。

          ## ビルド例

          ```bash
          cmake -S . -B build \
            -DPICO_SDK_PATH=/path/to/pico-sdk \
            -DPICO_BOARD=pico \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --parallel
          ```

          生成物は`build/pico_copter.uf2`です。

          既にEigenを持っている場合は、次を追加できます。

          ```bash
          -DEIGEN3_INCLUDE_DIR=/path/to/eigen
          ```
          README

          (
            cd firmware/pico_copter
            sha256sum "${PROGRAM_FILES[@]}" > SOURCE_SHA256SUMS.txt
            sha256sum --check --strict SOURCE_SHA256SUMS.txt
          )

          rm -rf source
          rm -f CMakeLists.txt SOURCE_SHA256SUMS.txt
          rm -f .github/workflows/migrate-firmware-layout.yml

      - name: Commit portable firmware layout
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move firmware into portable project folder"
          git push origin HEAD:main
